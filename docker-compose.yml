services:
  backend:
    build:
      context: ./backend
    image: signai-backend:latest
    container_name: signai-backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      USERS_FILE: /data/users.json
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    image: signai-frontend:latest
    container_name: signai-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
